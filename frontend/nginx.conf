# The official Nginx image renders this file as a template at container start.
# The TEST-NET default configured by Compose trusts no reachable peer. Production
# deployments must set AUTO_INVOICE_TRUSTED_PROXY_CIDR to the immediate TLS
# proxy's exact address or narrow CIDR.
set_real_ip_from ${AUTO_INVOICE_TRUSTED_PROXY_CIDR};
real_ip_header X-Forwarded-For;
real_ip_recursive on;

geo $realip_remote_addr $auto_invoice_trusted_proxy {
    default 0;
    ${AUTO_INVOICE_TRUSTED_PROXY_CIDR} 1;
}

map "$auto_invoice_trusted_proxy:$http_x_forwarded_proto" $auto_invoice_forwarded_proto {
    default $scheme;
    "1:http" http;
    "1:https" https;
}

map $auto_invoice_forwarded_proto $auto_invoice_hsts {
    default "";
    https "max-age=31536000; includeSubDomains";
}

limit_req_zone $binary_remote_addr zone=auth_sign_in:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=auth_mfa:10m rate=20r/m;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Keep ordinary JSON/form commands small. The only large request surface is
    # the explicitly allowlisted file upload endpoint below.
    client_max_body_size 1m;
    server_tokens off;

    limit_req_status 429;
    include /etc/nginx/snippets/auto-invoice-security-headers.conf;

    location = /api/v1/auth/sign-in {
        limit_req zone=auth_sign_in burst=5 nodelay;
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $auto_invoice_forwarded_proto;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header X-Forwarded-Ssl "";
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 120s;
    }

    location = /api/v1/auth/mfa/verify {
        limit_req zone=auth_mfa burst=10 nodelay;
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $auto_invoice_forwarded_proto;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header X-Forwarded-Ssl "";
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 120s;
    }

    location = /api/v1/files {
        client_max_body_size 26m;
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $auto_invoice_forwarded_proto;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header X-Forwarded-Ssl "";
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 120s;
    }

    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $auto_invoice_forwarded_proto;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header X-Forwarded-Ssl "";
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 120s;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/auto-invoice-security-headers.conf;
    }

    location = /index.html {
        try_files $uri =404;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/auto-invoice-security-headers.conf;
    }

    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/snippets/auto-invoice-security-headers.conf;
    }
}
