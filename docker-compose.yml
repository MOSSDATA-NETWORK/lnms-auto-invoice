name: auto-invoice

x-application-environment: &application-environment
  DATABASE_URL: jdbc:postgresql://postgres:5432/auto_invoice
  DATABASE_USERNAME: auto_invoice_app
  DATABASE_PASSWORD: ${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD}
  FLYWAY_ENABLED: "false"
  AUTO_INVOICE_MASTER_KEY_BASE64: ${AUTO_INVOICE_MASTER_KEY_BASE64:?Set AUTO_INVOICE_MASTER_KEY_BASE64 to a Base64-encoded 32-byte key}
  LIBRENMS_ALLOWED_ORIGINS: ${LIBRENMS_ALLOWED_ORIGINS:?Set LIBRENMS_ALLOWED_ORIGINS to the comma-separated exact LibreNMS origins}
  S3_ENDPOINT: http://minio:9000
  S3_BUCKET: ${S3_BUCKET:-auto-invoice}

x-worker: &worker
  build:
    context: .
    dockerfile: backend/worker/Dockerfile
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=512m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  cpus: ${WORKER_CPU_LIMIT:-1.0}
  mem_limit: ${WORKER_MEMORY_LIMIT:-1g}
  pids_limit: ${WORKER_PIDS_LIMIT:-256}
  healthcheck:
    test:
      - CMD-SHELL
      - >-
        for process in /proc/[0-9]*/comm; do
          if IFS= read -r name < "$$process" && [ "$$name" = java ]; then exit 0; fi;
        done;
        exit 1
    interval: 30s
    timeout: 3s
    retries: 3
    start_period: 20s
  depends_on:
    flyway:
      condition: service_completed_successfully
    minio-init:
      condition: service_completed_successfully

services:
  postgres:
    image: postgres:16.9-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: auto_invoice
      POSTGRES_USER: auto_invoice_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD}
      POSTGRES_MIGRATION_PASSWORD: ${POSTGRES_MIGRATION_PASSWORD:?Set POSTGRES_MIGRATION_PASSWORD}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/postgres/10-init-roles.sh:/docker-entrypoint-initdb.d/10-init-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [core]

  flyway:
    image: redgate/flyway:13.1.0-alpine
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/auto_invoice
      FLYWAY_USER: auto_invoice_migrator
      FLYWAY_PASSWORD: ${POSTGRES_MIGRATION_PASSWORD:?Set POSTGRES_MIGRATION_PASSWORD}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      FLYWAY_CONNECT_RETRIES: "60"
      FLYWAY_VALIDATE_MIGRATION_NAMING: "true"
      FLYWAY_CLEAN_DISABLED: "true"
    command: ["migrate"]
    volumes:
      - ./backend/core/src/main/resources/db/migration:/flyway/sql:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks: [core]

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    restart: unless-stopped
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-auto-invoice-root}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [core]

  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-auto-invoice-root}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-auto-invoice}
      S3_API_ACCESS_KEY: ${S3_API_ACCESS_KEY:-auto-invoice-api}
      S3_API_SECRET_KEY: ${S3_API_SECRET_KEY:?Set S3_API_SECRET_KEY}
      S3_RENDER_ACCESS_KEY: ${S3_RENDER_ACCESS_KEY:-auto-invoice-render}
      S3_RENDER_SECRET_KEY: ${S3_RENDER_SECRET_KEY:?Set S3_RENDER_SECRET_KEY}
      S3_SYNC_ACCESS_KEY: ${S3_SYNC_ACCESS_KEY:-auto-invoice-sync}
      S3_SYNC_SECRET_KEY: ${S3_SYNC_SECRET_KEY:?Set S3_SYNC_SECRET_KEY}
      S3_NOTIFICATION_ACCESS_KEY: ${S3_NOTIFICATION_ACCESS_KEY:-auto-invoice-notification}
      S3_NOTIFICATION_SECRET_KEY: ${S3_NOTIFICATION_SECRET_KEY:?Set S3_NOTIFICATION_SECRET_KEY}
      S3_IMPORT_ACCESS_KEY: ${S3_IMPORT_ACCESS_KEY:-auto-invoice-import}
      S3_IMPORT_SECRET_KEY: ${S3_IMPORT_SECRET_KEY:?Set S3_IMPORT_SECRET_KEY}
      S3_BILLING_ACCESS_KEY: ${S3_BILLING_ACCESS_KEY:-auto-invoice-billing}
      S3_BILLING_SECRET_KEY: ${S3_BILLING_SECRET_KEY:?Set S3_BILLING_SECRET_KEY}
    volumes:
      - ./deploy/minio/policies:/policies:ro
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "local/$${S3_BUCKET}"

        for policy in api render sync notification import; do
          sed "s/__BUCKET__/$${S3_BUCKET}/g" "/policies/$${policy}.json" > "/tmp/$${policy}.json"
          mc admin policy create local "auto-invoice-$${policy}" "/tmp/$${policy}.json"
        done

        ensure_user() {
          if mc admin user info local "$${1}" >/dev/null 2>&1; then
            mc admin user remove local "$${1}"
          fi
          mc admin user add local "$${1}" "$${2}"
          if [ -n "$${3}" ]; then
            mc admin policy attach local "$${3}" --user "$${1}"
          fi
        }

        ensure_user "$${S3_API_ACCESS_KEY}" "$${S3_API_SECRET_KEY}" auto-invoice-api
        ensure_user "$${S3_RENDER_ACCESS_KEY}" "$${S3_RENDER_SECRET_KEY}" auto-invoice-render
        ensure_user "$${S3_SYNC_ACCESS_KEY}" "$${S3_SYNC_SECRET_KEY}" auto-invoice-sync
        ensure_user "$${S3_NOTIFICATION_ACCESS_KEY}" "$${S3_NOTIFICATION_SECRET_KEY}" auto-invoice-notification
        ensure_user "$${S3_IMPORT_ACCESS_KEY}" "$${S3_IMPORT_SECRET_KEY}" auto-invoice-import
        ensure_user "$${S3_BILLING_ACCESS_KEY}" "$${S3_BILLING_SECRET_KEY}" ""
    networks: [core]

  mailpit:
    image: axllent/mailpit:v1.27.8
    profiles: [dev]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"
    networks: [edge]

  api:
    build:
      context: .
      dockerfile: backend/api/Dockerfile
    restart: unless-stopped
    init: true
    environment:
      <<: *application-environment
      BOOTSTRAP_ADMIN_ENABLED: ${BOOTSTRAP_ADMIN_ENABLED:-false}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      OPENAPI_DOCS_ENABLED: ${OPENAPI_DOCS_ENABLED:-false}
      SWAGGER_UI_ENABLED: ${SWAGGER_UI_ENABLED:-false}
      S3_ACCESS_KEY: ${S3_API_ACCESS_KEY:-auto-invoice-api}
      S3_SECRET_KEY: ${S3_API_SECRET_KEY:?Set S3_API_SECRET_KEY}
    depends_on:
      flyway:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cpus: ${API_CPU_LIMIT:-2.0}
    mem_limit: ${API_MEMORY_LIMIT:-1g}
    pids_limit: ${API_PIDS_LIMIT:-256}
    networks: [core]

  render-worker:
    <<: *worker
    security_opt:
      - no-new-privileges:true
      - seccomp=./deploy/playwright/seccomp_profile.json
    cpus: ${RENDER_WORKER_CPU_LIMIT:-2.0}
    mem_limit: ${RENDER_WORKER_MEMORY_LIMIT:-2g}
    pids_limit: ${RENDER_WORKER_PIDS_LIMIT:-512}
    shm_size: ${RENDER_WORKER_SHM_SIZE:-1g}
    environment:
      <<: *application-environment
      S3_ACCESS_KEY: ${S3_RENDER_ACCESS_KEY:-auto-invoice-render}
      S3_SECRET_KEY: ${S3_RENDER_SECRET_KEY:?Set S3_RENDER_SECRET_KEY}
      WORKER_ID: render-worker-1
      WORKER_JOB_TYPES: RENDER_INVOICE_PDF
    networks: [core]

  sync-worker:
    <<: *worker
    environment:
      <<: *application-environment
      S3_ACCESS_KEY: ${S3_SYNC_ACCESS_KEY:-auto-invoice-sync}
      S3_SECRET_KEY: ${S3_SYNC_SECRET_KEY:?Set S3_SYNC_SECRET_KEY}
      WORKER_ID: sync-worker-1
      WORKER_JOB_TYPES: LIBRENMS_VERIFY,LIBRENMS_DISCOVER_BILLS,LIBRENMS_SYNC_HISTORY
    networks: [core, edge]

  billing-worker:
    <<: *worker
    environment:
      <<: *application-environment
      S3_ACCESS_KEY: ${S3_BILLING_ACCESS_KEY:-auto-invoice-billing}
      S3_SECRET_KEY: ${S3_BILLING_SECRET_KEY:?Set S3_BILLING_SECRET_KEY}
      WORKER_ID: billing-worker-1
      WORKER_JOB_TYPES: GENERATE_INVOICE_PREVIEW
      SCHEDULER_ENABLED: "true"
    networks: [core]

  notification-worker:
    <<: *worker
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m,mode=1777
    environment:
      <<: *application-environment
      S3_ACCESS_KEY: ${S3_NOTIFICATION_ACCESS_KEY:-auto-invoice-notification}
      S3_SECRET_KEY: ${S3_NOTIFICATION_SECRET_KEY:?Set S3_NOTIFICATION_SECRET_KEY}
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST; use mailpit only with the dev profile}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-true}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_STARTTLS_REQUIRED: ${SMTP_STARTTLS_REQUIRED:-true}
      SMTP_CHECK_SERVER_IDENTITY: ${SMTP_CHECK_SERVER_IDENTITY:-true}
      SMTP_ALLOW_INSECURE: ${SMTP_ALLOW_INSECURE:-false}
      NOTIFICATION_EMAIL_FROM: ${NOTIFICATION_EMAIL_FROM:?Set NOTIFICATION_EMAIL_FROM}
      WORKER_ID: notification-worker-1
      WORKER_JOB_TYPES: SEND_NOTIFICATION
      OUTBOX_PUBLISHER_ENABLED: "true"
      OUTBOX_PUBLISHER_ID: notification-worker-1
    networks: [core, edge]

  import-worker:
    <<: *worker
    cpus: ${IMPORT_WORKER_CPU_LIMIT:-1.5}
    mem_limit: ${IMPORT_WORKER_MEMORY_LIMIT:-1536m}
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m,mode=1777
    environment:
      <<: *application-environment
      S3_ACCESS_KEY: ${S3_IMPORT_ACCESS_KEY:-auto-invoice-import}
      S3_SECRET_KEY: ${S3_IMPORT_SECRET_KEY:?Set S3_IMPORT_SECRET_KEY}
      WORKER_ID: import-worker-1
      WORKER_JOB_TYPES: IMPORT_VALIDATE,IMPORT_CONFIRM
    networks: [core]

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /etc/nginx/conf.d:size=1m,mode=1777
      - /var/cache/nginx:size=32m,mode=1777
      - /var/run:size=1m,mode=1777
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cpus: ${WEB_CPU_LIMIT:-0.5}
    mem_limit: ${WEB_MEMORY_LIMIT:-256m}
    pids_limit: ${WEB_PIDS_LIMIT:-128}
    environment:
      # TEST-NET-1 is intentionally unreachable here, so no proxy is trusted
      # unless production explicitly supplies the immediate proxy CIDR.
      AUTO_INVOICE_TRUSTED_PROXY_CIDR: ${AUTO_INVOICE_TRUSTED_PROXY_CIDR:-192.0.2.1/32}
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8088}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/ >/dev/null"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks: [core, edge]

volumes:
  postgres-data:
  minio-data:

networks:
  core:
    internal: true
  edge:
